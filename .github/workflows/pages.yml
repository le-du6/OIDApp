# Déploiement GitHub Pages du build statique.
#
# Prérequis : Settings > Pages > Build and deployment > Source doit être
# configuré sur « GitHub Actions ». Cette activation requiert un droit
# d'administration et ne peut pas être effectuée par GITHUB_TOKEN.
name: Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Configurer Pages
        id: pages
        uses: actions/configure-pages@v5
      - run: npm ci
      - run: npm run build
        env:
          # base_path vient de configure-pages : « /OIDApp/ » pour un site de
          # projet, « / » avec un domaine personnalisé. Plus fiable que de le
          # déduire du nom du dépôt.
          VITE_BASE: ${{ steps.pages.outputs.base_path }}
      # SPA : les deep links (/oauth2/…) doivent servir index.html.
      - run: cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
