# Déploiement GitHub Pages du build statique.
#
# Aucune action manuelle requise : `actions/configure-pages` avec
# `enablement: true` ACTIVE Pages en mode « GitHub Actions » si ce n'est pas
# déjà fait. Sans cette étape, deploy-pages échoue avec
# « Get Pages site failed » tant que le réglage n'a pas été fait à la main.
name: Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Activer et configurer Pages
        id: pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - run: npm ci
      - run: npm run build
        env:
          # base_path vient de configure-pages : « /OIDApp/ » pour un site de
          # projet, « / » avec un domaine personnalisé. Plus fiable que de le
          # déduire du nom du dépôt.
          VITE_BASE: ${{ steps.pages.outputs.base_path }}
      # SPA : les deep links (/oauth2/…) doivent servir index.html.
      - run: cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
